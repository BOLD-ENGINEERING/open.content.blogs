name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.ref }}
          filters: |
            web:
              - 'web/**'
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.web == 'true'
        with:
          version: 11.7.0
          standalone: true
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.web == 'true'
        with:
          node-version: 22.12.0
      - name: Install dependencies
        if: steps.changes.outputs.web == 'true'
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        if: steps.changes.outputs.web == 'true'
        run: pnpm format:check
      - name: Check types
        if: steps.changes.outputs.web == 'true'
        run: pnpm check
      - name: Build
        if: steps.changes.outputs.web == 'true'
        run: pnpm build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.ref }}
          filters: |
            api:
              - 'api/**'
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.api == 'true'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/pyproject.toml
      - name: Install dependencies
        if: steps.changes.outputs.api == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --group dev
      - name: Lint
        if: steps.changes.outputs.api == 'true'
        run: ruff check .
      - name: Check formatting
        if: steps.changes.outputs.api == 'true'
        run: ruff format --check .
      - name: Test
        if: steps.changes.outputs.api == 'true'
        run: pytest

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.ref }}
          filters: |
            worker:
              - 'worker/**'
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.worker == 'true'
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: Install dependencies
        if: steps.changes.outputs.worker == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Lint
        if: steps.changes.outputs.worker == 'true'
        run: ruff check .
      - name: Check formatting
        if: steps.changes.outputs.worker == 'true'
        run: ruff format --check .
      - name: Test
        if: steps.changes.outputs.worker == 'true'
        run: pytest

  fixtures:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.ref }}
          filters: |
            fixtures:
              - 'web/**'
              - 'test-fixtures/**'
              - '.github/workflows/ci.yml'
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.fixtures == 'true'
        with:
          version: 11.7.0
          standalone: true
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.fixtures == 'true'
        with:
          node-version: 22.12.0
      - name: Install dependencies
        if: steps.changes.outputs.fixtures == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build and verify sample content
        if: steps.changes.outputs.fixtures == 'true'
        run: pnpm test:fixtures

  worker-e2e:
    runs-on: ubuntu-latest
    env:
      OCB_E2E_ROOT: ${{ github.workspace }}/worker/.artifacts/e2e
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.ref }}
          filters: |
            e2e:
              - 'web/**'
              - 'worker/**'
              - 'test-fixtures/**'
              - '.github/workflows/ci.yml'
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.e2e == 'true'
        with:
          python-version: '3.14'
      - uses: pnpm/action-setup@v6
        if: steps.changes.outputs.e2e == 'true'
        with:
          version: 11.7.0
          standalone: true
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.e2e == 'true'
        with:
          node-version: 22.12.0
      - name: Install template dependencies
        if: steps.changes.outputs.e2e == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install worker dev dependencies and browser
        if: steps.changes.outputs.e2e == 'true'
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
          python -m playwright install --with-deps chromium
      - name: Full local pipeline and visual QA
        if: steps.changes.outputs.e2e == 'true'
        working-directory: worker
        run: pytest -m e2e -v
      - name: Upload screenshots and build logs
        if: always() && steps.changes.outputs.e2e == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: worker-e2e-evidence
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            docs/qa/phase-2/screenshots/
            worker/.artifacts/e2e/builds/**/build.log
            worker/.artifacts/e2e/serve.log
            worker/.artifacts/e2e/visual-*.json
