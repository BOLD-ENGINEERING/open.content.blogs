[dependency-groups]
dev = ["pytest", "ruff", "playwright==1.63.0"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not e2e'"
markers = ["e2e: full local Git, Astro, HTTP, and browser pipeline"]
